[package]
name = "z-biz-tool-math"
version = "0.2.1"
description = "GeoLab 数学实验室：几何画板式动态几何 + 函数/复平面/向量/曲面/矩阵/神经网络可视化工作台"
edition = "2021"
license = "MIT"

[lib]
name = "z_biz_tool_math_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 家族统一深链协议（cap-hub）：zbiz:// 的构造、解析、待处理队列与产品清单。
cap-hub = { path = "../../z-biz-tool-capability/crates/cap-hub", version = "0.1.0", features = ["tauri"] }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---- 体积与构建产物治理（2026-11-03 全仓统一）----
# release 关闭调试符号与增量编译：产物体积约为 debug 的 1/3~1/5，
# 且避免 incremental/ 缓存随编译会话无限累积（Tauri 家族 16 仓曾累积 80GB+）。
[profile.release]
debug = false
incremental = false
strip = "symbols"
