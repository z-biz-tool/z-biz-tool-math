[package]
name = "z-biz-tool-math"
version = "0.2.1"
description = "GeoLab 数学实验室：几何画板式动态几何 + 函数/复平面/向量/曲面/矩阵/神经网络可视化工作台"
edition = "2021"
license = "MIT"

[lib]
name = "z_biz_tool_math_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 家族统一深链协议（cap-hub）：zbiz:// 的构造、解析、待处理队列与产品清单。
cap-hub = { path = "../../z-biz-tool-capability/crates/cap-hub", features = ["tauri"] }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
